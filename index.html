<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Human vs Neural Network Pong (Mouse Control)</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 { color: #66fcf1; margin-bottom: 5px; }
        p { color: #45a29e; margin-top: 0; }

        .game-wrapper {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        canvas {
            border: 2px solid #45a29e;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
            background: #1f2833;
            border-radius: 8px;
            cursor: none; /* Hide default cursor over canvas for immersion */
        }

        .panel {
            background: #1f2833;
            border: 1px solid #45a29e;
            padding: 15px;
            border-radius: 8px;
            width: 280px;
        }

        .panel h3 { color: #66fcf1; margin-top: 0; }
        .controls { margin-top: 15px; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <h1>Human vs Artificial Neural Network</h1>
    <p>Mouse Control Mode | Real-Time Neural Network Node Activations</p>

    <div class="game-wrapper">
        <!-- Main Game Screen -->
        <canvas id="pongCanvas" width="800" height="500"></canvas>

        <!-- Live ANN Neural Network Activation Visualizer -->
        <div class="panel">
            <h3>Neural Network Live Vis</h3>
            <canvas id="nnCanvas" width="280" height="320"></canvas>
            <div class="controls">
                <strong>Controls:</strong><br>
                • Move your cursor vertically inside the game area to position the blue paddle.
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        const nnCanvas = document.getElementById('nnCanvas');
        const nnCtx = nnCanvas.getContext('2d');

        // Track Mouse Y Position over Canvas
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            socket.emit('player_mouse', { mouse_y: mouseY });
        });

        // Receive state updates from server
        socket.on('state_update', (data) => {
            const state = data.state;
            const acts = data.activations;

            // --- Render Pong Arena ---
            ctx.fillStyle = '#1f2833';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center Net Line
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = '#45a29e';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            // Scores
            ctx.font = 'bold 32px Arial';
            ctx.fillStyle = '#66fcf1';
            ctx.fillText(`Human: ${state.human_score}`, 150, 50);
            ctx.fillStyle = '#ff4c4c';
            ctx.fillText(`ANN AI: ${state.ai_score}`, 520, 50);

            // Human Paddle (Blue)
            ctx.fillStyle = '#66fcf1';
            ctx.fillRect(30, state.human_y, 15, 90);

            // AI Paddle (Red)
            ctx.fillStyle = '#ff4c4c';
            ctx.fillRect(canvas.width - 45, state.ai_y, 15, 90);

            // Ball
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(state.ball_x, state.ball_y, 15, 15);

            // --- Render ANN Visualizer ---
            drawNeuralNetwork(acts);
        });

        function drawNeuralNetwork(acts) {
            nnCtx.fillStyle = '#1f2833';
            nnCtx.fillRect(0, 0, nnCanvas.width, nnCanvas.height);

            const layers = [
                { count: 5, values: acts.input },
                { count: 8, values: acts.h1.slice(0, 8) },
                { count: 6, values: acts.h2.slice(0, 6) },
                { count: 3, values: acts.output }
            ];

            const layerX = [30, 100, 180, 250];

            layers.forEach((layer, lIdx) => {
                const x = layerX[lIdx];
                const stepY = nnCanvas.height / (layer.count + 1);

                for (let i = 0; i < layer.count; i++) {
                    const y = stepY * (i + 1);
                    const val = Math.max(0, Math.min(1, layer.values[i] || 0));

                    nnCtx.beginPath();
                    nnCtx.arc(x, y, 8, 0, Math.PI * 2);
                    nnCtx.fillStyle = `rgba(102, 252, 241, ${val + 0.1})`;
                    nnCtx.fill();
                    nnCtx.strokeStyle = '#66fcf1';
                    nnCtx.stroke();
                }
            });
        }
    </script>
</body>
</html>
